<div class="main">
  <div class="header">
    <div class="logo">
      <img src="assets/logo.jpg" alt="image not found">
    </div>
    <div class="menu">
        <a href="#" *ngFor="let item of menues">
          {{item.name}} <i *ngIf="item.logo.length > 0" [ngClass]="item.logo"></i>
        </a>
    </div>
    <div class="login">
      <div class="sign-in">
        <a href="#">Sign In</a>/
        <a href="#">Resister</a>
      </div>
      <button class="btn log-out">Log Out</button>
    </div>
      <i class="fa fa-shopping-cart" (click)="showCart()"></i>
      <div class="cart-items" *ngIf="isShow">
        <ng-container *ngIf="items.length">
          <div class="cart-item" *ngFor="let item of items">
            <div class="cart-item-img">
              <img [src]="item.img" alt="image not found">
            </div>
            <div class="cart-item-action">
              <i class="fa fa-remove" (click)="removeItem(item.id)"></i>
            </div>
          </div>
        </ng-container>
    
      </div>
  </div>
  <div class="body">
    <div class="cards">
      <div class="card" *ngFor="let card of cards">
        <img *ngIf="card.hasSale" class="sale-logo" src="assets/sale.png">
        <div class="card-img">
          <img [src]="card.img" alt="inage not found">
        </div>
        <div class="card-body">
          <p>
            {{card.desc}}
          </p>
          <p class="price">Price: 
            <span [ngClass]="{'prev-price': card.hasSale}">
            {{card.price}} {{card.ccy}} </span> 
            <span *ngIf="card.hasSale" class="new-price">
            {{card.salePirce}} {{card.ccy}}
          </span> </p>
        </div>
        <div class="card-footer">
          <button class="btn buy" (click)="addCart(card)">Buy</button>
          <div class="star">
            <i [ngClass]="{'fa fa-star': true, 'fill': card.star > 0}" style="font-size:20px"></i>
            <i [ngClass]="{'fa fa-star': true, 'fill': card.star > 1}" style="font-size:20px"></i>
            <i [ngClass]="{'fa fa-star': true, 'fill': card.star > 2}" style="font-size:20px"></i>
            <i [ngClass]="{'fa fa-star': true, 'fill': card.star > 3}" style="font-size:20px"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer"></div>
</div>
