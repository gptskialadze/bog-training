<div class="main">
  <div class="header">
    <div class="profile">
      <img [src]="img" alt="">
    </div>
    <div class="client-info">
      <div class="client-name"><span>Name: </span>{{client.clientName}}</div>
      <div class="client-age"><span>Age: </span> {{client.clientAge}}</div>
      <div class="client-pin"><span>Pin: </span> {{client.clientPin}}</div>
    </div>
    <div class="actions" (click)="changeData()">
      <button>Change</button>
    </div>
  </div>
  <div class="accounts">
    <label>ანგ: </label>
    <span>{{ client.getAcctoNo() }}</span>
  </div>
  <div class="cards">
    <label for="">ბარათი: </label>
    <span>{{ cardNo }}</span>
  </div>
</div>
