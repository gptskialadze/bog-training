<div class="container">
    <form>
        <fieldset>
          <legend>Register Form</legend>
          <div class="mb-3">
            <label class="form-label">ClientKey</label>
            <input type="text"  class="form-control">
          </div>
          <div class="mb-3">
            <label  class="form-label">City</label>
            <select  class="form-select">
              <option>აირჩიე</option>
              <option>Tbilisi</option>
              <option>Batumi</option>
            </select>
          </div>
     

          <div class="row">
            <div class="col-3">
              <label  class="form-label">Street</label>
              <input type="text" class="form-control" >
            </div>

            <div class="col-3">
              <label class="form-label">District</label>
              <input type="text" class="form-control" >
            </div>

            <div class="col-3">
              <label class="form-label">Zip Code</label>
              <input type="text" class="form-control" >
            </div>
          </div>

          <div class="row" style="margin-top: 10px;">
            <div class="col-4">
              <label class="form-label">Account CCY</label>
              <select class="form-select">
                <option>აირჩიე</option>
                <option value="">GEL</option>
                <option value="">USD</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">Accounts</label>
              <select class="form-select">
                <option>აირჩიე</option>
                <option value="">GE01BG020202002</option>
                <option value="">GE01BG020202002</option>
              </select>
            </div>
          </div>
          <label for="" style="margin-top: 20px;">Card Type</label>
          <div class="row" style="margin-top: 20px;">
          
            <div class="col-2">
              <label for="">VISA</label>
              <br>
              <input type="checkbox" class="form-check-input">
            </div>

            <div class="col-2">
              <label class="form-label">MC</label>
              <br>
              <input type="checkbox" class="form-check-input">
            </div>

            <div class="col-2">
              <label class="form-label">AMEX</label>
              <br>
              <input type="checkbox" class="form-check-input">
            </div>

            <div class="col-2">
              <label class="form-label">ALL</label>
              <br>
              <input type="checkbox" class="form-check-input">
            </div>

          </div>

          <div class="row" style="margin-top: 20px;">
            <div class="mb-3">
              <label class="form-label">Card Number</label>
              <input type="text" class="form-control">
            </div>
          </div>
          <div class="mb-3" style="margin-top: 10px;">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="disabledFieldsetCheck">
              <label class="form-check-label" for="disabledFieldsetCheck">
                I Agree
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Submit</button>
        </fieldset>
      </form>
</div>
